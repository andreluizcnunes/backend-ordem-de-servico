name: ordem-servico-backend

services:
  backend:
    build: .
    image: backend-ordem-de-servico:latest
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://${BANCO_HOST:-postgres}:5432/${DB_NOME:-ordem_servico}
      DB_USUARIO: ${DB_USUARIO:-ordem_servico}
      DB_SENHA: ${DB_SENHA:?defina DB_SENHA no arquivo .env}
      APP_JWT_SEGREDO: ${APP_JWT_SEGREDO:?defina APP_JWT_SEGREDO no arquivo .env}
      APP_JWT_EXPIRACAO: ${APP_JWT_EXPIRACAO:-PT8H}
      APP_DONO_INICIAL_NOME: ${APP_DONO_INICIAL_NOME:-}
      APP_DONO_INICIAL_EMAIL: ${APP_DONO_INICIAL_EMAIL:-}
      APP_DONO_INICIAL_SENHA: ${APP_DONO_INICIAL_SENHA:-}
      APP_CORS_ORIGENS: ${APP_CORS_ORIGENS:-http://localhost:5173}
      APP_FUSO_HORARIO: ${APP_FUSO_HORARIO:-America/Sao_Paulo}
      APP_EMPRESA_NOME: ${APP_EMPRESA_NOME:-MARWIL}
    ports:
      - "${APP_PORTA:-8080}:8080"
    networks:
      - banco

networks:
  banco:
    name: ${BANCO_REDE:-ordem-servico}
    external: true
