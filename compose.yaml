name: ordem-servico

services:
  banco:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NOME:-ordem_servico}
      POSTGRES_USER: ${DB_USUARIO:-postgres}
      POSTGRES_PASSWORD: ${DB_SENHA:?defina DB_SENHA no arquivo .env}
    volumes:
      - dados-banco:/var/lib/postgresql
      - ${BANCO_SCRIPTS_DIR:-./src/test/resources/db}:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: .
    image: backend-ordem-de-servico:latest
    restart: unless-stopped
    depends_on:
      banco:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://banco:5432/${DB_NOME:-ordem_servico}
      DB_USUARIO: ${DB_USUARIO:-postgres}
      DB_SENHA: ${DB_SENHA:?defina DB_SENHA no arquivo .env}
      APP_JWT_SEGREDO: ${APP_JWT_SEGREDO:?defina APP_JWT_SEGREDO no arquivo .env}
      APP_JWT_EXPIRACAO: ${APP_JWT_EXPIRACAO:-PT8H}
      APP_DONO_INICIAL_NOME: ${APP_DONO_INICIAL_NOME:-}
      APP_DONO_INICIAL_EMAIL: ${APP_DONO_INICIAL_EMAIL:-}
      APP_DONO_INICIAL_SENHA: ${APP_DONO_INICIAL_SENHA:-}
      APP_CORS_ORIGENS: ${APP_CORS_ORIGENS:-http://localhost:5173}
      APP_FUSO_HORARIO: ${APP_FUSO_HORARIO:-America/Sao_Paulo}
      APP_EMPRESA_NOME: ${APP_EMPRESA_NOME:-MARWIL}
    ports:
      - "${APP_PORTA:-8080}:8080"

volumes:
  dados-banco:
