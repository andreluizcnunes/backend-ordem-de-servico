spring.application.name=backend-ordem-de-servico

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ordem_servico}
spring.datasource.username=${DB_USUARIO:postgres}
spring.datasource.password=${DB_SENHA:}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

server.error.include-message=never
server.error.include-stacktrace=never

app.jwt.segredo=${APP_JWT_SEGREDO}
app.jwt.expiracao=${APP_JWT_EXPIRACAO:PT8H}

app.dono-inicial.nome=${APP_DONO_INICIAL_NOME:}
app.dono-inicial.email=${APP_DONO_INICIAL_EMAIL:}
app.dono-inicial.senha=${APP_DONO_INICIAL_SENHA:}

app.cors.origens=${APP_CORS_ORIGENS:http://localhost:5173}
app.fuso-horario=${APP_FUSO_HORARIO:America/Sao_Paulo}
app.empresa.nome=${APP_EMPRESA_NOME:MARWIL}
